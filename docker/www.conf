[www]
user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data

; Tuned for a small shared VPS (~1 vCPU, low free RAM). Each php-fpm child
; costs roughly 30-50MB with this app's dependency set, so keep the pool
; small rather than let it get OOM-killed under a burst.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

clear_env = no
